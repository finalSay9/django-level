{% extends "base.html" %}

{% block content %}
  <h1>Welcome to the School Management System</h1>

  {% if user.is_authenticated %}
    <p>You are logged in as {{ user.get_full_name|default:user.email|default:"Unknown" }}</p>
  {% else %}
    <p>Welcome, guest! Please <a href="{% url 'login' %}">log in</a>.</p>
  {% endif %}
{% endblock %}
